; MeshChat LoRa relay node - ESP32 DevKit V1 + RA-02 (SX1278) + 1602 LCD + keyboard
; Build:  pio run          Flash:  pio run -t upload          Serial monitor:  pio device monitor
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=5
    -DCORE_DEBUG_LEVEL=0
    ; LCD: 1 = I2C backpack (PCF8574, address set on the setup page), 0 = plain 16-pin parallel wiring
    -DLCD_I2C=1
lib_deps =
    h2zero/NimBLE-Arduino@1.4.3
    jgromes/RadioLib@6.6.0
    marcoschwartz/LiquidCrystal_I2C@1.1.4
    bblanchon/ArduinoJson@7.2.1
